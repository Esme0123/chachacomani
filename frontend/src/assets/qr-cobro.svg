<svg xmlns="http://www.w3.org/2000/svg" width="320" height="380" viewBox="0 0 320 380" role="img" aria-labelledby="qrTitle qrDesc">
  <title id="qrTitle">QR estático de cobro</title>
  <desc id="qrDesc">Código QR de ejemplo para cobros de la Cooperativa Minera Nevado Chachacomani R.L.</desc>
  <defs>
    <pattern id="qrModules" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#0f172a"/>
      <rect x="6" y="6" width="6" height="6" fill="#0f172a"/>
    </pattern>
    <filter id="qrShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="320" height="380" rx="24" fill="#f8fafc"/>
  <rect x="14" y="14" width="292" height="352" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#qrShadow)"/>

  <text x="160" y="50" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0f172a">COOPERATIVA MINERA</text>
  <text x="160" y="69" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#b45309" letter-spacing="1">NEVADO CHACHACOMANI R.L.</text>

  <rect x="40" y="86" width="240" height="240" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
  <rect x="48" y="94" width="224" height="224" fill="url(#qrModules)"/>

  <g fill="#ffffff">
    <rect x="48" y="94" width="56" height="56"/>
    <rect x="216" y="94" width="56" height="56"/>
    <rect x="48" y="262" width="56" height="56"/>
  </g>
  <g fill="none" stroke="#0f172a" stroke-width="8">
    <rect x="52" y="98" width="48" height="48"/>
    <rect x="220" y="98" width="48" height="48"/>
    <rect x="52" y="266" width="48" height="48"/>
  </g>
  <g fill="#0f172a">
    <rect x="68" y="114" width="16" height="16"/>
    <rect x="236" y="114" width="16" height="16"/>
    <rect x="68" y="282" width="16" height="16"/>
  </g>

  <rect x="150" y="182" width="20" height="20" rx="3" fill="#b45309"/>
  <rect x="176" y="156" width="12" height="12" fill="#0f172a"/>
  <rect x="176" y="182" width="12" height="12" fill="#0f172a"/>
  <rect x="150" y="208" width="12" height="12" fill="#0f172a"/>
  <rect x="176" y="208" width="20" height="20" rx="3" fill="#b45309"/>

  <text x="160" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f172a">QR ESTÁTICO DE COBRO</text>
  <text x="160" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">Escanee desde su aplicación bancaria</text>
</svg>
